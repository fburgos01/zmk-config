# ZMK Configuration Options for SHW48+48 
# Activa ZMK Studio
CONFIG_ZMK_STUDIO=y

# Permite guardar cambios de keymap en la memoria Flash no volátil
CONFIG_ZMK_STUDIO_LOCKING=n

# Habilita perfiles Bluetooth y USB
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# IMPORTANTE: Activar la consola USB y los canales de transporte para Studio
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_CDC_ACM=y
CONFIG_ZMK_STUDIO_RPC_USB_UART=y
